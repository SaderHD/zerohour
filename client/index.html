<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zero Hour</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui">
      <div id="tags"></div>
      <div id="hud">
        <div id="hurt"></div>
        <div id="zone"></div>
        <div id="stats"></div>
        <div id="scope"></div>
        <div id="crosshair"><i></i><i></i><i></i><i></i></div>
        <div id="hitmarker"></div>
        <div id="ammo">
          <div id="ammo-name"></div>
          <div><span id="ammo-mag"></span><span id="ammo-reserve"></span></div>
          <div id="ammo-nades"></div>
        </div>
        <div id="prompt"></div>
        <div id="progress"><i></i></div>
        <div id="round"></div>
        <div id="perks"></div>
        <div id="effects"></div>
        <div id="banner"><div id="banner-title"></div><div id="banner-sub"></div></div>
        <div id="points-pop"></div>
        <div id="points"></div>
        <div id="downed">
          <div id="downed-title"></div>
          <div id="downed-bar"><i></i></div>
          <div id="downed-sub"></div>
        </div>
        <div id="scoreboard"><div class="sub" id="scoreboard-title"></div><table></table></div>
        <div id="hint">Click to play · WASD move · Shift sprint · LMB fire · RMB aim · R reload · Q swap · V knife · G grenade · F rebuild / revive · Tab scores</div>
        <div id="stamina"><div id="stamina-fill"></div></div>
      </div>

      <div id="menu" class="screen">
        <h1>ZERO HOUR</h1>
        <p class="sub">Harrow Ridge Station · 1–4 survivors</p>
        <label>Name <input id="name" maxlength="16" autocomplete="off" spellcheck="false" /></label>
        <button id="create">Create game</button>
        <div class="row">
          <input id="code" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false" />
          <button id="join">Join</button>
        </div>
        <p id="menu-error" class="error"></p>
      </div>

      <div id="lobby" class="screen">
        <p class="sub">Room code</p>
        <h1 id="lobby-code"></h1>
        <ul id="lobby-players"></ul>
        <div class="row">
          <button id="ready">Ready</button>
          <button id="start">Start</button>
        </div>
        <button id="leave" class="quiet">Leave</button>
        <p id="lobby-error" class="error"></p>
      </div>

      <div id="results" class="screen">
        <h1>GAME OVER</h1>
        <p class="sub" id="results-sub"></p>
        <table></table>
        <div class="row">
          <button id="again">Back to lobby</button>
          <button id="results-leave" class="quiet">Leave</button>
        </div>
      </div>

      <div id="status" data-state="connecting">connecting…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
